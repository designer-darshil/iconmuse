<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IconMuse</title>
    <style>
      :root { color-scheme: light dark; font: 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--figma-color-text, #202124); background: var(--figma-color-bg, #fff); }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; }
      header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
      h1 { font-size:16px; margin:0; font-weight:650; letter-spacing:-.02em; }
      .brand { color:#6c4bf4; }
      .settings-toggle { border:0; background:transparent; color:var(--figma-color-text-secondary,#777); cursor:pointer; font-size:11px; padding:5px; }
      .search { position:relative; margin-bottom:9px; }
      input, select { width:100%; height:34px; border:1px solid var(--figma-color-border,#ddd); border-radius:7px; padding:0 10px; background:var(--figma-color-bg-secondary,#fff); color:inherit; font:inherit; outline:none; }
      input:focus, select:focus { border-color:#6c4bf4; box-shadow:0 0 0 1px #6c4bf4; }
      .filters { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      select { height:30px; padding:0 7px; }
      #status { min-height:30px; display:flex; align-items:center; color:var(--figma-color-text-secondary,#777); font-size:11px; }
      #status.error { color:#c33; }
      #grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; }
      .icon { min-width:0; height:74px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:7px 4px; border:1px solid transparent; border-radius:8px; background:var(--figma-color-bg-secondary,#f5f5f5); color:inherit; cursor:pointer; }
      .icon:hover { border-color:#6c4bf4; background:var(--figma-color-bg-hover,#eee); }
      .preview { display:flex; align-items:center; justify-content:center; width:32px; height:32px; color:var(--figma-color-text,#333); }
      .preview svg { width:28px; height:28px; max-width:100%; max-height:100%; }
      .label { width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; font-size:10px; }
      #more { display:none; width:100%; height:32px; margin-top:10px; border:1px solid var(--figma-color-border,#ddd); border-radius:7px; color:inherit; background:transparent; cursor:pointer; }
      #settings { display:none; border-top:1px solid var(--figma-color-border,#ddd); padding-top:12px; margin-top:14px; }
      #settings label { display:block; margin:0 0 6px; color:var(--figma-color-text-secondary,#777); }
      #settings input { font-size:11px; }
      .hint { margin:7px 0 0; color:var(--figma-color-text-tertiary,#888); font-size:10px; line-height:1.45; }
      @media (prefers-color-scheme: dark) { .icon { background:var(--figma-color-bg-secondary,#2c2c2c); } }
    </style>
  </head>
  <body>
    <header><h1><span class="brand">Icon</span>Muse</h1><button id="settings-toggle" class="settings-toggle" type="button">API settings</button></header>
    <input id="query" type="search" placeholder="Search 28,000+ icons" autocomplete="off" aria-label="Search icons" />
    <div class="filters">
      <select id="source" aria-label="Filter by source"><option value="">All libraries</option></select>
      <select id="style" aria-label="Filter by style"><option value="">All styles</option></select>
    </div>
    <div id="status" role="status" aria-live="polite">Type at least 2 characters to search.</div>
    <div id="grid" aria-label="Icon search results"></div>
    <button id="more" type="button">Load more</button>
    <section id="settings">
      <label for="api-url">IconMuse API URL</label>
      <input id="api-url" type="url" placeholder="https://iconmuse-figma-api.<account>.workers.dev" />
      <p class="hint">Run the Worker locally at http://localhost:8787, or enter your deployed Workers URL. Your selection is saved in this browser profile.</p>
    </section>
    <script type="module" src="./src/ui.ts"></script>
  </body>
</html>
